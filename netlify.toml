# Netlify 配置：纯静态站点，发布仓库根目录（index.html 在这一层）
[build]
  publish = "."

# 入口 / SW / 清单不长期缓存，保证更新及时生效
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
